name: Build FullSeek-Chat installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: FullSeek-Chat-Windows
          path: release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:android
      - uses: actions/upload-artifact@v4
        with:
          name: FullSeek-Chat-Android
          path: android/app/build/outputs/apk/debug/*.apk
